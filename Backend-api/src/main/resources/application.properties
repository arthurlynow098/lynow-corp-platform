spring.application.name=lynow-api

#O Endereço do Cofre e o nome do banco que criamos ontem
spring.datasource.url=jdbc:mysql://localhost:3306/lynow_db

#O seu usuário e senha do MySQL 
spring.datasource.username=root
spring.datasource.password=

#O dialeto exato para o tradutor
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostra no terminal os comandos SQL que o Spring fizer por baixo dos panos (Ótimo para debug)
spring.jpa.show-sql=true